<puzzle-splash />
<puzzle-notice [game]="game" />

@if (tutorial(); as t) {
  <puzzle-tutorial [controls]="t" (skip)="endTutorial()">
    <slant-board [state]="t.state()" [hint]="t.hint()" (move)="t.move($event)" />
  </puzzle-tutorial>
} @else {
  <puzzle-shell [controls]="session" (help)="startTutorial()">
    <slant-board
      [state]="session.state()"
      [thinking]="thinking()"
      [showMistakes]="session.showMistakes()"
      (move)="session.move($event)" />

    <div puzzleTools class="thinking">
      <puzzle-switch [(checked)]="thinking" description="Swipes draw dotted lines, to try out an idea">
        Thinking
      </puzzle-switch>
      @if (thinking() || hasThoughts()) {
        <button type="button" (click)="resolveThoughts(true)" [disabled]="!hasThoughts()">Keep</button>
        <button type="button" (click)="resolveThoughts(false)" [disabled]="!hasThoughts()">Discard</button>
      }
    </div>
  </puzzle-shell>
}
